<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status — PingStep</title><meta name="description" content="PingStep public service health."><meta name="robots" content="noindex"><link rel="icon" href="/pingstep-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/site.css"></head><body><nav class="nav"><a class="brand" href="/"><img src="/pingstep-mark.svg" alt="">PingStep</a><span class="nav-right"><a href="/pricing.html">Pricing</a><a class="back" href="/app">Dashboard</a></span></nav><main><h1>Service status</h1><div id="health" class="status" aria-live="polite"><span class="dot"></span><div><strong>Checking PingStep</strong><br><span class="muted">Connecting to the service health endpoint.</span></div></div><p class="lead">This page checks whether the PingStep application health endpoint is responding. It does not confirm the health of your own job or network.</p></main><footer><a href="/docs.html">Docs</a><a href="/security.html">Security</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/contact.html">Contact</a></footer><script>const health=document.querySelector('#health');fetch('/health',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(()=>health.innerHTML='<span class="dot ok"></span><div><strong>PingStep is online</strong><br><span class="muted">The application health endpoint is responding.</span></div>').catch(()=>health.innerHTML='<span class="dot bad"></span><div><strong>PingStep may be unavailable</strong><br><span class="muted">Try again shortly. If this persists, contact support.</span></div>');</script></body></html>
