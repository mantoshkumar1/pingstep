<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PingStep — Runs</title>
    <link rel="icon" href="/pingstep-mark.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: light; --ink:#18212f; --muted:#64748b; --line:#dbe3ee; --page:#f6f8fb; --card:#fff; --blue:#155eef; --red:#c4320a; --yellow:#b54708; --green:#067647; }
      * { box-sizing: border-box; } body { margin:0; color:var(--ink); background:var(--page); font:14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      header { background:#111827; color:#fff; padding:24px max(24px, calc((100vw - 1180px) / 2)); display:flex; justify-content:space-between; align-items:center; gap:16px; }
      h1 { font-size:20px; margin:0; letter-spacing:-.02em; } .brand { display:flex; align-items:center; gap:9px; } .brand img { width:29px; height:29px; } header p { margin:3px 0 0; color:#cbd5e1; } main { max-width:1180px; margin:28px auto; padding:0 24px 40px; }
      .summary { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:24px; } .metric { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:15px; } .metric strong { display:block; font-size:26px; letter-spacing:-.04em; } .metric span { color:var(--muted); font-size:12px; }
      section { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; } section + section { margin-top:24px; } .section-head { padding:16px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); } h2 { margin:0; font-size:15px; } h3 { margin:0 0 10px; font-size:14px; } button { background:#fff; border:1px solid #b9c6d8; color:#334155; padding:7px 10px; border-radius:6px; cursor:pointer; font:inherit; } button.active { background:var(--blue); border-color:var(--blue); color:#fff; } button + button { margin-left:6px; }
      table { border-collapse:collapse; width:100%; } th { background:#f8fafc; color:var(--muted); font-size:11px; letter-spacing:.04em; text-transform:uppercase; text-align:left; } th, td { padding:12px 18px; border-bottom:1px solid var(--line); } tr:last-child td { border-bottom:0; } tr[data-run] { cursor:pointer; } tr[data-run]:hover { background:#f8fbff; } .mono { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; color:#475569; } .badge { display:inline-flex; align-items:center; border-radius:999px; padding:3px 8px; font-size:12px; font-weight:600; } .running { color:#175cd3; background:#eff8ff; } .stale { color:var(--red); background:#fff1f0; } .late { color:var(--yellow); background:#fffaeb; } .succeeded { color:var(--green); background:#ecfdf3; } .failed { color:var(--red); background:#fff1f0; } .empty { color:var(--muted); text-align:center; padding:34px; } .operator-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:18px; } form { display:grid; gap:10px; } label { color:var(--muted); font-size:12px; } input { width:100%; padding:8px; border:1px solid #b9c6d8; border-radius:6px; font:inherit; } pre { margin:10px 0 0; padding:10px; overflow:auto; background:#f8fafc; border:1px solid var(--line); border-radius:6px; font:12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre-wrap; } .alert-row { border-bottom:1px solid var(--line); padding:8px 0; } .alert-row:last-child { border-bottom:0; } dialog { width:min(720px, calc(100vw - 32px)); border:0; border-radius:12px; box-shadow:0 22px 65px #0f172a66; padding:0; } dialog::backdrop { background:#0f172a77; } .modal-head { padding:18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; } .modal-body { padding:18px; max-height:65vh; overflow:auto; } .event { border-left:3px solid var(--line); padding:0 0 15px 14px; margin:0 0 14px; } .event strong { text-transform:capitalize; } .event p { margin:3px 0 0; color:var(--muted); } .notice { color:var(--muted); font-size:12px; } @media (max-width:720px) { .summary { grid-template-columns:repeat(2,1fr); } .operator-grid { grid-template-columns:1fr; } th:nth-child(3), td:nth-child(3) { display:none; } main { padding:0 12px; } header { padding:18px 12px; } th,td { padding:10px 12px; } }
    </style>
  </head>
  <body>
    <header><div class="brand"><img src="/pingstep-mark.svg" alt=""><div><h1>PingStep</h1><p>Progress-aware monitoring for unattended scripts</p></div></div><div><span id="updated" class="notice">Operator sign-in required</span><button id="sign-in">Sign in</button></div></header>
    <main>
      <div class="summary" aria-label="Run summary"><div class="metric"><strong id="active-count">0</strong><span>Running</span></div><div class="metric"><strong id="stale-count">0</strong><span>Stale</span></div><div class="metric"><strong id="succeeded-count">0</strong><span>Succeeded</span></div><div class="metric"><strong id="failed-count">0</strong><span>Failed</span></div></div>
      <section id="operator-section"><div class="section-head"><h2>Operator controls</h2><span class="notice">Use synthetic jobs before launch.</span></div><div class="operator-grid"><div><form id="provision-job"><label>Job key<input name="job_key" required pattern="[A-Za-z0-9._-]{2,101}" value="synthetic-test"></label><label>Expected update interval (seconds)<input name="expected_update_interval_seconds" type="number" min="1" value="60"></label><label>Liveness grace (seconds)<input name="liveness_grace_seconds" type="number" min="0" value="120"></label><button type="submit">Create job token</button></form><div id="provision-result" class="notice"></div></div><div><h3>Recent alerts</h3><div id="alerts" class="notice">Sign in to view alerts.</div></div></div></section>
      <section><div class="section-head"><h2>Runs</h2><div><button id="active-filter" class="active">Open</button><button id="all-filter">All recent</button></div></div><div id="table-wrap"></div></section>
    </main>
    <dialog id="detail"><div class="modal-head"><div><h2 id="detail-title">Run details</h2><span id="detail-status"></span></div><button id="close-detail" aria-label="Close run details">Close</button></div><div id="detail-body" class="modal-body"></div></dialog>
    <script>
      const state = { runs: [], alerts: [], filter: 'active', operatorToken: sessionStorage.getItem('pingstep-operator-token') || '', role: null };
      const $ = (id) => document.getElementById(id);
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
      const date = (value) => value ? new Intl.DateTimeFormat(undefined, { dateStyle:'medium', timeStyle:'short' }).format(new Date(value)) : '—';
      const open = (run) => ['running', 'stale'].includes(run.status);
      function render() {
        const byStatus = (status) => state.runs.filter((run) => run.status === status).length;
        $('active-count').textContent = byStatus('running'); $('stale-count').textContent = byStatus('stale'); $('succeeded-count').textContent = byStatus('succeeded'); $('failed-count').textContent = byStatus('failed');
        $('active-filter').classList.toggle('active', state.filter === 'active'); $('all-filter').classList.toggle('active', state.filter === 'all');
        const runs = state.filter === 'active' ? state.runs.filter(open) : state.runs;
        $('table-wrap').innerHTML = runs.length ? `<table><thead><tr><th>Job</th><th title="PingStep's lifecycle assessment">Run status</th><th title="The most recent named progress marker sent by the job">Last reported stage</th><th>Last update</th><th>Run ID</th></tr></thead><tbody>${runs.map((run) => `<tr data-run data-job="${escapeHtml(run.job_key)}" data-id="${escapeHtml(run.run_id)}"><td>${escapeHtml(run.job_key)}</td><td><span class="badge ${escapeHtml(run.status)}">${escapeHtml(run.status)}</span>${run.is_late ? ' <span class="badge late">late</span>' : ''}</td><td>${escapeHtml(run.current_step || 'No stage reported yet')}</td><td>${date(run.received_at)}</td><td class="mono">${escapeHtml(run.run_id)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No runs to show yet.</div>';
        document.querySelectorAll('[data-run]').forEach((row) => row.addEventListener('click', () => showDetail(row.dataset.job, row.dataset.id)));
      }
      function renderAlerts() { $('alerts').innerHTML = state.alerts.length ? state.alerts.map((alert) => `<div class="alert-row"><span class="badge ${escapeHtml(alert.type === 'stale' ? 'stale' : 'late')}">${escapeHtml(alert.type)}</span> <strong>${escapeHtml(alert.job_key)}</strong><br><span class="notice">${escapeHtml(alert.message)} · ${date(alert.created_at)} · ${escapeHtml(alert.delivery_status)}</span></div>`).join('') : '<span class="notice">No alerts yet.</span>'; }
      const auth = () => state.operatorToken ? { Authorization: `Bearer ${state.operatorToken}` } : {};
      async function refreshOperator() { if (!state.operatorToken || state.role !== 'operator') return; const response = await fetch('/v1/alerts', { cache:'no-store', headers:auth() }); if (response.ok) { state.alerts = (await response.json()).alerts; renderAlerts(); } }
      async function refresh() { try { const response = await fetch('/v1/runs', { cache:'no-store', headers:auth() }); if (response.status === 401) throw new Error('Sign in with an access token.'); if (!response.ok) throw new Error('Unable to load runs.'); const payload = await response.json(); state.runs = payload.runs; state.role = payload.role; $('operator-section').hidden = state.role !== 'operator'; $('updated').textContent = `Updated ${new Date().toLocaleTimeString()}`; render(); await refreshOperator(); } catch (error) { $('updated').textContent = error.message; } }
      async function showDetail(jobKey, runId) { const run = state.runs.find((item) => item.job_key === jobKey && item.run_id === runId); $('detail-title').textContent = jobKey; $('detail-status').innerHTML = `<span class="badge ${escapeHtml(run.status)}">${escapeHtml(run.status)}</span>`; $('detail-body').innerHTML = '<p class="notice">Loading event history…</p>'; $('detail').showModal(); try { const eventResponse = await fetch(`/v1/runs/${encodeURIComponent(jobKey)}/${encodeURIComponent(runId)}/events`, { headers:auth() }); if (!eventResponse.ok) throw new Error('Could not load event history.'); const events = (await eventResponse.json()).events; $('detail-body').innerHTML = `<p class="notice mono">${escapeHtml(runId)}</p>${events.map((event) => `<div class="event"><strong>${escapeHtml(event.type)}</strong><p>${date(event.received_at)} · sequence ${event.sequence}${event.data?.name ? ` · ${escapeHtml(event.data.name)}` : ''}${event.data?.message ? ` · ${escapeHtml(event.data.message)}` : ''}</p></div>`).join('') || '<p class="notice">No events found.</p>'}`; } catch { $('detail-body').innerHTML = '<p class="notice">Could not load event history.</p>'; } }
      $('active-filter').addEventListener('click', () => { state.filter = 'active'; render(); }); $('all-filter').addEventListener('click', () => { state.filter = 'all'; render(); }); $('close-detail').addEventListener('click', () => $('detail').close()); $('sign-in').addEventListener('click', () => { const token = window.prompt('Paste an operator token or your job viewer token. It is stored only for this browser session.'); if (token) { state.operatorToken = token; sessionStorage.setItem('pingstep-operator-token', token); refresh(); } }); $('provision-job').addEventListener('submit', async (event) => { event.preventDefault(); const form = new FormData(event.currentTarget); $('provision-result').textContent = 'Creating job…'; const response = await fetch('/v1/operator/jobs', { method:'POST', headers:{ ...auth(), 'Content-Type':'application/json' }, body:JSON.stringify({ job_key:form.get('job_key'), expected_update_interval_seconds:Number(form.get('expected_update_interval_seconds')), liveness_grace_seconds:Number(form.get('liveness_grace_seconds')) }) }); const result = await response.json(); if (!response.ok) { $('provision-result').textContent = result.error || 'Could not create job.'; return; } $('provision-result').innerHTML = '<strong>Save these one-time tokens:</strong><p class="notice">Job token: the script uses this to send events. Viewer token: the pilot user uses this to view only this job.</p>'; for (const value of [result.token, result.viewer_token]) { const token = document.createElement('pre'); token.textContent = value; $('provision-result').append(token); } }); renderAlerts(); refresh(); setInterval(refresh, 3000);
    </script>
  </body>
</html>
