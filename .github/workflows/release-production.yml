name: Release PingStep to production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RELEASE to confirm a production release of main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pingstep-production
  cancel-in-progress: false

jobs:
  verify:
    name: Recheck main before release
    if: inputs.confirmation == 'RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run worker:check
      - run: npm run worker:deploy:dry-run

  deploy:
    name: Release reviewed main to pingstep.dev
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://pingstep.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Apply any new production-database changes
        run: npx wrangler d1 migrations apply pingstep --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the reviewed build to pingstep.dev
        run: npm run worker:deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
