name: Quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_staging_e2e:
        description: 'Run staging e2e late-run test'
        type: boolean
        default: true

permissions:
  contents: read

# =============================================================================
# Required status checks for branch protection
# =============================================================================
# When configuring branch protection on `main`, mark these jobs as required:
#
#   1. "Lint, test, and build"    — unit tests, coverage, e2e, type check, deploy dry-run
#
# These jobs run only on push to main and should NOT be required status checks:
#
#   2. "Deploy staging"           — deploys to staging after verification passes on main
#   3. "Staging: late-run e2e"    — long-running staging integration test
#
# The production release workflow (release-production.yml) is triggered manually
# and re-verifies the tagged commit independently.
# =============================================================================

jobs:
  verify:
    name: Lint, test, and build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Coverage (worker core ≥ 90% lines/functions, ≥ 65% branches)
        run: npm run test:coverage
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (local server)
        run: npm run test:e2e
      - name: TypeScript type check
        run: npm run worker:check
      - name: Worker build — production dry-run
        run: npm run worker:deploy:dry-run
      - name: Worker build — staging dry-run
        run: npm run worker:deploy:staging:dry-run

  deploy-staging:
    name: Deploy staging
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pingstep-staging
      cancel-in-progress: true
    environment:
      name: staging
      url: https://pingstep-staging.mantoshk234.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Apply any new test-database changes
        run: npx wrangler d1 migrations apply pingstep-staging --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the tested build to the safe test site
        run: >-
          npx wrangler deploy --env staging
          --var RELEASE_VERSION:staging-$(git rev-parse --short HEAD)
          --var RELEASE_SHA:$(git rev-parse --short HEAD)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  e2e-late-run:
    name: "Staging: late-run e2e"
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: pingstep-staging-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Run late-run e2e test against staging
        run: node scripts/verify-late-run-staging.mjs
        env:
          PINGSTEP_STAGING_BASE_URL: https://pingstep-staging.mantoshk234.workers.dev
          PINGSTEP_STAGING_OPERATOR_TOKEN: ${{ secrets.PINGSTEP_STAGING_OPERATOR_TOKEN }}
          E2E_RUN_SUFFIX: gh-${{ github.run_id }}-${{ github.run_attempt }}

  e2e-late-run-manual:
    name: "Staging: late-run e2e (manual)"
    if: github.event_name == 'workflow_dispatch' && inputs.run_staging_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: pingstep-staging-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Run late-run e2e test against staging
        run: node scripts/verify-late-run-staging.mjs
        env:
          PINGSTEP_STAGING_BASE_URL: https://pingstep-staging.mantoshk234.workers.dev
          PINGSTEP_STAGING_OPERATOR_TOKEN: ${{ secrets.PINGSTEP_STAGING_OPERATOR_TOKEN }}
          E2E_RUN_SUFFIX: manual-${{ github.run_id }}-${{ github.run_attempt }}
